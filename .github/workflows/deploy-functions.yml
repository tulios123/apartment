name: Deploy edge functions

# Edge functions were the one part of the stack still deployed by hand, so a fix could
# sit merged for weeks while the live function kept running the old code — which is
# exactly what happened to the daily "deposit the cheque" reminder (fixed 16.07, still
# nagging in August). Now they ship with the code that contains them.
#
# main only: functions are shared by one Supabase project, so deploying from staging
# would push unreviewed code straight into production's cron.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without the token this is a no-op with a clear message, rather than a red X
      # on every push until the secret is added.
      - name: Check for access token
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping function deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.skip == 'false'
        with:
          version: latest

      - name: Deploy functions
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy --project-ref bjholzkesnzkbogxmurw
